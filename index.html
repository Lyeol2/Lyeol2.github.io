<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="main-desktop">
    <div class="main-stack div-vertical fill">
      <!-- Navigation -->
      <div class="navigate div-horizontal fill-horizontal">
        <div class="icon-panel right-anchor r-padding-30">
          <p class="brand-text right-anchor center">JJIJIM'S BLOG</p>
        </div>

        <div class="navigate-buttons div-horizontal right-anchor end-stacking fill l-padding-20">
          <p class="home-text center">home</p>
          <p class="post-text center">post</p>
          <p class="none-text center">none</p>
          <p class="none-text center">none</p>
        </div>
      </div>

      <!-- Main panel -->
      <div class="main-panel div-horizontal fill-horizontal">
        <p class="title-text fill center">title-text</p>

        <div class="frame frame-right-half" data-slider>
          <div class="slide-track">
            <section class="slide is-active">
              <p class="slide-kicker">01</p>
              <h2>Today</h2>
              <p>짧게 쓰고 자주 돌아보는 기록.</p>
            </section>
            <section class="slide">
              <p class="slide-kicker">02</p>
              <h2>Build</h2>
              <p>만든 것과 고친 이유를 남기기.</p>
            </section>
            <section class="slide">
              <p class="slide-kicker">03</p>
              <h2>Learn</h2>
              <p>다음 작업을 위한 작은 힌트 모으기.</p>
            </section>
          </div>

          <div class="slide-controls" aria-label="슬라이드 조작">
            <button class="slide-button" type="button" data-slide-prev aria-label="이전 슬라이드">‹</button>
            <div class="slide-dots" aria-label="슬라이드 위치">
              <button class="slide-dot is-active" type="button" data-slide-dot="0" aria-label="1번 슬라이드"></button>
              <button class="slide-dot" type="button" data-slide-dot="1" aria-label="2번 슬라이드"></button>
              <button class="slide-dot" type="button" data-slide-dot="2" aria-label="3번 슬라이드"></button>
            </div>
            <button class="slide-button" type="button" data-slide-next aria-label="다음 슬라이드">›</button>
          </div>
        </div>
      </div>

      <!-- Bottom panel -->
      <div class="bottom-panel div-horizontal fill-horizontal"></div>
    </div>
  </main>

  <script>
    const slider = document.querySelector("[data-slider]");

    if (slider) {
      const track = slider.querySelector(".slide-track");
      const slides = [...slider.querySelectorAll(".slide")];
      const dots = [...slider.querySelectorAll(".slide-dot")];
      const prevButton = slider.querySelector("[data-slide-prev]");
      const nextButton = slider.querySelector("[data-slide-next]");
      let currentSlide = 0;

      function showSlide(index) {
        currentSlide = (index + slides.length) % slides.length;
        track.style.transform = `translateX(-${currentSlide * 100}%)`;

        slides.forEach((slide, slideIndex) => {
          slide.classList.toggle("is-active", slideIndex === currentSlide);
        });

        dots.forEach((dot, dotIndex) => {
          dot.classList.toggle("is-active", dotIndex === currentSlide);
        });
      }

      prevButton.addEventListener("click", () => showSlide(currentSlide - 1));
      nextButton.addEventListener("click", () => showSlide(currentSlide + 1));

      dots.forEach((dot) => {
        dot.addEventListener("click", () => showSlide(Number(dot.dataset.slideDot)));
      });
    }

  </script>
</body>
</html>
