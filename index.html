<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="main-desktop">
    <div class="main-stack div-vertical fill">
      <!-- Navigation -->
      <div class="navigate div-horizontal fill-horizontal">
        <div class="icon-panel right-anchor r-padding-30">
          <p class="brand-text right-anchor center">JJIJIM'S BLOG</p>
        </div>

        <div class="navigate-buttons div-horizontal right-anchor end-stacking fill l-padding-20">
          <p class="home-text center">home</p>
          <p class="post-text center">post</p>
          <p class="none-text center">none</p>
          <p class="none-text center">none</p>
        </div>
      </div>

      <!-- Main panel -->
      <div class="main-panel div-horizontal fill-horizontal">
        <p class="title-text fill center">title-text</p>

        <div class="frame frame-right-half" data-slider>
          <div class="slide-track">
            <section class="slide is-active">
              <p class="slide-kicker">01</p>
              <h2>Today</h2>
              <p>짧게 쓰고 자주 돌아보는 기록.</p>
            </section>
            <section class="slide">
              <p class="slide-kicker">02</p>
              <h2>Build</h2>
              <p>만든 것과 고친 이유를 남기기.</p>
            </section>
            <section class="slide">
              <p class="slide-kicker">03</p>
              <h2>Learn</h2>
              <p>다음 작업을 위한 작은 힌트 모으기.</p>
            </section>
          </div>

          <div class="slide-controls" aria-label="슬라이드 조작">
            <button class="slide-button" type="button" data-slide-prev aria-label="이전 슬라이드">‹</button>
            <div class="slide-dots" aria-label="슬라이드 위치">
              <button class="slide-dot is-active" type="button" data-slide-dot="0" aria-label="1번 슬라이드"></button>
              <button class="slide-dot" type="button" data-slide-dot="1" aria-label="2번 슬라이드"></button>
              <button class="slide-dot" type="button" data-slide-dot="2" aria-label="3번 슬라이드"></button>
            </div>
            <button class="slide-button" type="button" data-slide-next aria-label="다음 슬라이드">›</button>
          </div>
        </div>
      </div>

      <!-- Wave section -->
      <div class="wave-section">
        <canvas id="wave-canvas"></canvas>
      </div>

      <!-- Bottom panel -->
      <div class="bottom-panel div-horizontal fill-horizontal"></div>
    </div>
  </main>

  <script>
    const slider = document.querySelector("[data-slider]");

    if (slider) {
      const track = slider.querySelector(".slide-track");
      const slides = [...slider.querySelectorAll(".slide")];
      const dots = [...slider.querySelectorAll(".slide-dot")];
      const prevButton = slider.querySelector("[data-slide-prev]");
      const nextButton = slider.querySelector("[data-slide-next]");
      let currentSlide = 0;

      function showSlide(index) {
        currentSlide = (index + slides.length) % slides.length;
        track.style.transform = `translateX(-${currentSlide * 100}%)`;

        slides.forEach((slide, slideIndex) => {
          slide.classList.toggle("is-active", slideIndex === currentSlide);
        });

        dots.forEach((dot, dotIndex) => {
          dot.classList.toggle("is-active", dotIndex === currentSlide);
        });
      }

      prevButton.addEventListener("click", () => showSlide(currentSlide - 1));
      nextButton.addEventListener("click", () => showSlide(currentSlide + 1));

      dots.forEach((dot) => {
        dot.addEventListener("click", () => showSlide(Number(dot.dataset.slideDot)));
      });
    }

    /* ── Wave Animation ── */
    (function () {
      const canvas = document.getElementById('wave-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      /* --- 리사이즈 (HiDPI 대응) --- */
      function resize() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width  = rect.width  * dpr;
        canvas.height = rect.height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      /* --- 파도 파라미터 --- */
      const OCEAN  = '#0085FB';
      const SAND   = '#FDBF5A';

      // 여러 겹의 파도 레이어
      const waves = [
        { amp: 14, len: 320, spd: 0.4, phase: 0.0, fill: OCEAN },                      // 뒤쪽 큰 파도
        { amp: 10, len: 220, spd: 0.6, phase: 1.8, fill: 'rgba(0,133,251,0.72)' },     // 중간 파도
        { amp:  7, len: 160, spd: 0.9, phase: 3.6, fill: 'rgba(0,133,251,0.50)' },     // 앞쪽 작은 파도
      ];

      // 거품(foam) 레이어
      const foam = { amp: 5, len: 190, spd: 0.55, phase: 1.0 };

      // 상하 움직임 (bobbing)
      const bob = { amp: 6, spd: 0.35 };

      /* --- 파형 y좌표 계산 함수 --- */
      function waveY(x, w, t, base) {
        return base + w.amp * Math.sin((x / w.len) * Math.PI * 2 + t * w.spd * Math.PI * 2 + w.phase);
      }

      /* --- 메인 드로우 루프 --- */
      const t0 = performance.now();

      function draw(now) {
        const t = (now - t0) / 1000;           // elapsed seconds
        const w = canvas.getBoundingClientRect().width;
        const h = canvas.getBoundingClientRect().height;

        // 상하 흔들림
        const bobY = bob.amp * Math.sin(t * bob.spd * Math.PI * 2);
        const baseY = h * 0.42 + bobY;

        ctx.clearRect(0, 0, w, h);

        // 1) 배경: 모래
        ctx.fillStyle = SAND;
        ctx.fillRect(0, 0, w, h);

        // 2) 파도 레이어 (뒤→앞 순서)
        for (const wave of waves) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          for (let x = 0; x <= w; x += 2) {
            ctx.lineTo(x, waveY(x, wave, t, baseY));
          }
          ctx.lineTo(w, 0);
          ctx.closePath();
          ctx.fillStyle = wave.fill;
          ctx.fill();
        }

        // 3) 거품 (foam) — 마지막 파도 위에 얇은 흰 띠
        const lastW = waves[waves.length - 1];
        ctx.beginPath();
        for (let x = 0; x <= w; x += 2) {
          const y = waveY(x, lastW, t, baseY);
          if (x === 0) ctx.moveTo(x, y - 1);
          else         ctx.lineTo(x, y - 1);
        }
        for (let x = w; x >= 0; x -= 2) {
          ctx.lineTo(x, waveY(x, foam, t, baseY + 10));
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,255,0.82)';
        ctx.fill();

        requestAnimationFrame(draw);
      }

      requestAnimationFrame(draw);
    })();

  </script>
</body>
</html>
