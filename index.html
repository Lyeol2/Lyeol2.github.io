<body>
  <main class="main-desktop">
    <div class="main-stack div-vertical fill">
      <canvas id="fish-canvas"></canvas>

      <!-- Navigation -->
      <div class="navigate div-horizontal">
        <div class="icon-panel center">

        <div class="navigate-buttons div-horizontal center">

          <a href="#" class="nav-link center" onclick="alert('contact 준비중입니다.')">contact</a>
        </div>

      <!-- Main panel -->
      <div class="main-panel div-horizontal fill-horizontal">
        <div class="title-container center div-vertical">
          <h1 class="title-text">JJIJIM'S BLOG</h1>
          <p class="subtitle-text">찌짐의 개발 블로그</p>

        <div class="right-half center">
          <div class="tube-ripples"></div>
          <div class="frame" data-slider>
            <div class="slide-track">
            <section class="slide is-active">
              <p class="slide-kicker">01</p>
              <h2>Total Posts</h2>
              <div class="stat-box">
                <span class="stat-number" data-total-posts>0</span>
                <span class="stat-label">posts published</span>
              </div>
            </section>
            <section class="slide">
              <p class="slide-kicker">02</p>
              <h2>Recent Posts</h2>
              <ul class="recent-post-list" data-recent-posts></ul>
            </section>
            <section class="slide">
              <p class="slide-kicker">03</p>
              <h2>About Me</h2>
              <p class="slide-desc">안녕하세여 찌짐 블로그에 온걸 환영합니다</p>
              <div class="social-links">
                <a href="https://github.com/Lyeol2" target="_blank" class="social-link">GitHub</a>

            </section>
            <section class="slide github-slide">
              <p class="slide-kicker">04</p>

                  <img class="github-grass-image" src="https://ghchart.rshah.org/FE707E/Lyeol2" alt="Lyeol2 GitHub contribution graph" loading="lazy" data-github-grass-image>
                  <div class="github-grass-month" data-github-grass-fallback hidden aria-hidden="true"></div>
                </div>
              </a>
              <p class="github-grass-caption">last 30 days / @Lyeol2</p>
            </section>
          </div>

          <div class="slide-controls" aria-label="슬라이드 조작">
            <div class="slide-dots" aria-label="슬라이드 위치">
              <button class="slide-dot is-active" type="button" data-slide-dot="0" aria-label="1번 슬라이드"></button>
              <button class="slide-dot" type="button" data-slide-dot="1" aria-label="2번 슬라이드"></button>
              <button class="slide-dot" type="button" data-slide-dot="2" aria-label="3번 슬라이드"></button>
            </div>
          </div>
          </div>
        </div>
      </div>

      <!-- Wave section -->
      <div class="wave-section">
        <canvas id="wave-canvas"></canvas>
      </div>

      <!-- Bottom panel (Sand beach / Post Section) -->
      <div id="post-section" class="bottom-panel">
        <div class="post-container">
          <!-- Left Sidebar: Categories -->
          <aside class="post-sidebar left-sidebar">
            <div class="widget category-widget glass-panel">
              <button class="category-toggle" type="button" aria-expanded="true" aria-controls="category-list">
                <span>카테고리</span>
                <span class="category-toggle-icon" aria-hidden="true"></span>
              </button>
              <ul id="category-list" class="category-list"></ul>
            </div>
          </aside>

          <!-- Center: Main Posts -->
          <section class="post-main">
            <div class="post-header">
              <h2 data-post-heading>전체 글</h2>

            <form class="post-search" role="search">
              <input class="post-search-input" type="search" placeholder="Search posts" aria-label="Search posts">
              <button class="post-search-button" type="submit">Search</button>
            </form>
            <div class="post-sort" aria-label="글 정렬">
              <button class="post-sort-button is-active" type="button" data-sort-mode="recent">최신순</button>
              <button class="post-sort-button" type="button" data-sort-mode="views">조회순</button>
            </div>
            <div class="post-list" id="post-list"></div>
            <article class="post-article glass-panel" id="post-article" hidden></article>
          </section>

          <!-- Right Sidebar: Widgets -->
          <aside class="post-sidebar right-sidebar">
            <div class="widget glass-panel">
              <h3>About Me</h3>
            </div>
            <div class="widget glass-panel">
              <h3>태그</h3>
              <div class="tag-cloud" id="tag-cloud"></div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </main>

  <script src="posts-manifest.js"></script>
  <script>
    const slider = document.querySelector("[data-slider]");

    if (slider) {
      const track = slider.querySelector(".slide-track");
      const slides = [...slider.querySelectorAll(".slide")];
      const dotsWrap = slider.querySelector(".slide-dots");
      if (dotsWrap && dotsWrap.children.length < slides.length) {
        for (let i = dotsWrap.children.length; i < slides.length; i += 1) {
          const dot = document.createElement("button");
          dot.className = "slide-dot";
          dot.type = "button";
          dot.dataset.slideDot = String(i);
          dot.setAttribute("aria-label", `${i + 1} slide`);
          dotsWrap.appendChild(dot);
        }
      }
      const dots = [...slider.querySelectorAll(".slide-dot")];
      let currentSlide = 0;

      slider.style.cursor = "pointer";
      slider.addEventListener("selectstart", (e) => e.preventDefault());
      slider.addEventListener("dragstart", (e) => e.preventDefault());
      slider.addEventListener("click", (e) => {
        // 링크나 점(dot)을 클릭한 경우에는 무시
        if (e.target.closest(".slide-dot") || e.target.closest("a")) return;
        showSlide(currentSlide + 1);
      });

      function showSlide(index) {
        currentSlide = (index + slides.length) % slides.length;
        track.style.transform = `translateX(-${currentSlide * 100}%)`;

        slides.forEach((slide, slideIndex) => {
          slide.classList.toggle("is-active", slideIndex === currentSlide);
        });

        dots.forEach((dot, dotIndex) => {
          dot.classList.toggle("is-active", dotIndex === currentSlide);
        });
      }

      dots.forEach((dot) => {
        dot.addEventListener("click", () => showSlide(Number(dot.dataset.slideDot)));
      });
    }

    const blogPosts = Array.isArray(window.BLOG_POSTS) ? window.BLOG_POSTS : [];
    const postList = document.querySelector("#post-list");
    const categoryList = document.querySelector("#category-list");
    const tagCloud = document.querySelector("#tag-cloud");
    const postSearch = document.querySelector(".post-search");
    const postSearchInput = document.querySelector(".post-search-input");
    const postSortButtons = [...document.querySelectorAll("[data-sort-mode]")];
    const postArticle = document.querySelector("#post-article");
    const postHeading = document.querySelector("[data-post-heading]");
    let activeCategory = "all";
    let sortMode = "recent";

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function normalizePostText(post) {
      return [
        post.display,
        post.description,
        post.recent,
        post.views,
        post.category,
        ...(post.tags || [])
      ].join(" ").toLowerCase();
    }

    function sortPosts(posts) {
      return [...posts].sort((a, b) => {
        if (sortMode === "views") {
          return Number(b.views || 0) - Number(a.views || 0);
        }

        return String(b.recent || "").localeCompare(String(a.recent || ""));
      });
    }

    function encodePathSegments(path) {
      return path.split("/").map((segment) => encodeURIComponent(segment)).join("/");
    }

    async function loadPostMarkdown(post) {
      const urls = [...new Set([
        post.path,
        encodeURI(post.path),
        encodePathSegments(post.path)
      ])];

      for (const url of urls) {
        try {
          const response = await fetch(url, { cache: "no-cache" });

          if (response.ok) {
            return await response.text();
          }
        } catch (error) {
          // Try the next path variant.
        }
      }

      throw new Error("Post markdown request failed.");
    }

    function getPostNeighbors(post) {
      const orderedPosts = sortPosts(blogPosts);
      const currentIndex = orderedPosts.findIndex((item) => item.path === post.path);

      return {
        prev: currentIndex > 0 ? orderedPosts[currentIndex - 1] : null,
        next: currentIndex >= 0 && currentIndex < orderedPosts.length - 1 ? orderedPosts[currentIndex + 1] : null
      };
    }

    function renderPostNav(post, className = "") {
      const { prev, next } = getPostNeighbors(post);

      return `
        <nav class="post-detail-nav ${className}" aria-label="글 이동">
          <button class="post-nav-button" type="button" data-post-nav="${prev ? escapeHtml(prev.path) : ""}" ${prev ? "" : "disabled"}>
            <span class="post-nav-label">이전글</span>
            <span class="post-nav-title">${prev ? escapeHtml(prev.display) : "이전 글 없음"}</span>
          </button>
          <button class="post-nav-button" type="button" data-post-nav="${next ? escapeHtml(next.path) : ""}" ${next ? "" : "disabled"}>
            <span class="post-nav-label">다음글</span>
            <span class="post-nav-title">${next ? escapeHtml(next.display) : "다음 글 없음"}</span>
          </button>
        </nav>
      `;
    }

    function bindPostNav(container) {
      container.querySelectorAll("[data-post-nav]").forEach((button) => {
        button.addEventListener("click", () => {
          const post = blogPosts.find((item) => item.path === button.dataset.postNav);

          if (post) {
            openPost(post);
          }
        });
      });
    }

    function getRecentPosts(limit = 3) {
      return [...blogPosts]
        .sort((a, b) => String(b.recent || "").localeCompare(String(a.recent || "")))
        .slice(0, limit);
    }

    function renderTubePostSummary() {
      const totalPosts = document.querySelector("[data-total-posts]");
      const recentPosts = document.querySelector("[data-recent-posts]");
      renderGithubGrassFallback();

      if (totalPosts) {
        totalPosts.textContent = String(blogPosts.length);
      }

      if (recentPosts) {
        recentPosts.innerHTML = getRecentPosts(3).map((post) => `
          <li>
            <a href="#" data-recent-post-path="${escapeHtml(post.path)}">${escapeHtml(post.display)}</a>
            <span class="date">${escapeHtml(post.recent || "-")}</span>
          </li>
        `).join("");

        recentPosts.querySelectorAll("[data-recent-post-path]").forEach(link => {
          link.addEventListener("click", (e) => {
            e.preventDefault();
            const post = blogPosts.find(p => p.path === link.dataset.recentPostPath);
            if (post) {
              openPost(post);
              const postSection = document.getElementById('post-section');
              if (postSection) {
                postSection.style.display = 'flex';
                setTimeout(() => {
                  postSection.scrollIntoView({ behavior: 'smooth' });
                }, 10);
              }
            }
          });
        });
      }
    }

    function renderGithubGrassFallback() {
      const image = document.querySelector("[data-github-grass-image]");
      const fallback = document.querySelector("[data-github-grass-fallback]");

      if (!image || !fallback || fallback.dataset.rendered === "true") return;

      fallback.innerHTML = Array.from({ length: 35 }, (_, index) => {
        const day = 34 - index;
        const level = day < 30 ? (index * 5 + Math.floor(index / 2)) % 5 : 0;
        return `<span class="grass-cell level-${level}"></span>`;
      }).join("");
      fallback.dataset.rendered = "true";

      image.addEventListener("error", () => {
        image.hidden = true;
        fallback.hidden = false;
      }, { once: true });
    }

    function renderCategories() {
      if (!categoryList) return;

      const root = { children: new Map(), count: blogPosts.length, path: "" };

      blogPosts.forEach((post) => {
        const parts = post.category.split("/").map((part) => part.trim()).filter(Boolean);
        let node = root;
        let currentPath = "";

        parts.forEach((part) => {
          currentPath = currentPath ? `${currentPath} / ${part}` : part;

          if (!node.children.has(part)) {
            node.children.set(part, { children: new Map(), count: 0, path: currentPath });
          }

          node = node.children.get(part);
          node.count += 1;
        });
      });

      function renderCategoryNodes(nodes) {
        return [...nodes.entries()].map(([label, node]) => {
          const isActive = node.path === activeCategory;
          const hasChildren = node.children.size > 0;
          const button = `
            <button type="button" class="category-button" data-category="${escapeHtml(node.path)}">
              ${escapeHtml(label)} <span>(${node.count})</span>
            </button>
          `;

          if (!hasChildren) {
            return `<li class="${isActive ? "is-active" : ""}">${button}</li>`;
          }

          return `
            <li class="category-folder ${isActive ? "is-active" : ""}">
              <details open>
                <summary>
                  <span class="category-folder-caret" aria-hidden="true"></span>
                  ${button}
                </summary>
                <ul class="category-sublist">
                  ${renderCategoryNodes(node.children)}
                </ul>
              </details>
            </li>
          `;
        }).join("");
      }

      categoryList.innerHTML = `
        <li class="${activeCategory === "all" ? "is-active" : ""}">
          <button type="button" class="category-button" data-category="all">
            전체보기 <span>(${blogPosts.length})</span>
          </button>
        </li>
        ${renderCategoryNodes(root.children)}
      `;

      categoryList.querySelectorAll("[data-category]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          activeCategory = button.dataset.category;
          renderCategories();
          renderPosts();
          closePost(); // 카테고리 클릭 시 글 보기 화면을 닫고 목록으로 복귀
        });
      });
    }

    function renderTags() {
      if (!tagCloud) return;

      const tags = [...new Set(blogPosts.flatMap((post) => post.tags || []))]
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b));

      tagCloud.innerHTML = tags.length
        ? tags.map((tag) => `<span class="tag">#${escapeHtml(tag)}</span>`).join("")
        : '<span class="tag">#untagged</span>';
    }

    function renderPosts() {
      if (!postList) return;

      const query = postSearchInput ? postSearchInput.value.trim().toLowerCase() : "";
      const filteredPosts = sortPosts(blogPosts
        .filter((post) => (
          activeCategory === "all" ||
          post.category === activeCategory ||
          post.category.startsWith(`${activeCategory} / `)
        ))
        .filter((post) => !query || normalizePostText(post).includes(query)));

      postList.innerHTML = filteredPosts.map((post) => {
        const tags = (post.tags || []).map((tag) => `<span class="post-tag">#${escapeHtml(tag)}</span>`).join("");
        const image = post.image
          ? `<img class="post-preview-image" src="${escapeHtml(post.image)}" alt="" loading="lazy">`
          : `<div class="post-preview-image post-preview-fallback" aria-hidden="true">${escapeHtml(post.category.slice(0, 1) || "P")}</div>`;

        return `
          <article class="post-card glass-panel">
            <a class="post-card-link" href="${escapeHtml(post.path)}" data-post-path="${escapeHtml(post.path)}">
              <div class="post-preview">${image}</div>
              <div class="post-card-content">
                <span class="post-category-label">${escapeHtml(post.category)}</span>
                <h3>${escapeHtml(post.display)}</h3>
                <p class="post-snippet">${escapeHtml(post.description || "설명이 아직 없습니다.")}</p>
                <div class="post-info-row">
                  <div class="post-meta">
                    <span class="post-date">${escapeHtml(post.recent || "-")}</span>
                    <span class="post-views">${Number(post.views || 0)} views</span>
                  </div>
                  <div class="post-tags">${tags || '<span class="post-tag">#untagged</span>'}</div>
                </div>
              </div>
            </a>
          </article>
        `;
      }).join("");

      postList.querySelectorAll("[data-post-path]").forEach((link) => {
        link.addEventListener("click", (event) => {
          const post = blogPosts.find((item) => item.path === link.dataset.postPath);

          if (!post) return;

          event.preventDefault();
          openPost(post);
        });
      });
    }

    function getPostAssetPath(post, filename) {
      const postName = post.path.split("/").pop().replace(/\.md$/i, "");
      return `posts/_assets/${postName}/${filename}`;
    }

    function openPostByName(postName) {
      // Find post by display name (which matches the [[Link]] text)
      // or by path
      const target = blogPosts.find(p => p.display.toLowerCase() === postName.toLowerCase() || p.path.toLowerCase().includes(postName.toLowerCase()));
      if (target) {
        openPost(target);
      } else {
        alert("아직 작성되지 않은 글입니다.");
      }
    }

    function renderMarkdown(markdown, post) {
      const body = markdown.replace(/^---[\s\S]*?---\s*/, "");
      const lines = body.split(/\r?\n/);
      let html = "";
      let inList = false;
      let inCardLink = false;
      let cardData = {};

      function closeList() {
        if (inList) {
          html += "</ul>";
          inList = false;
        }
      }

      function renderMath(tex, displayMode = false) {
        const source = String(tex || "").trim();

        if (!source) return "";

        if (window.katex) {
          try {
            const rendered = window.katex.renderToString(source, {
              displayMode,
              throwOnError: false,
              strict: "ignore",
              trust: false
            });
            return displayMode ? rendered : `<span class="math-inline">${rendered}</span>`;
          } catch (error) {
            console.warn("Math render failed:", error);
          }
        }

        const tag = displayMode ? "div" : "span";
        const className = displayMode ? "math-block-fallback" : "math-inline-fallback";
        return `<${tag} class="${className}">${escapeHtml(source)}</${tag}>`;
      }

      function renderMathBlock(tex) {
        return `<div class="math-block">${renderMath(tex, true)}</div>`;
      }

      function parseInline(text) {
        const tokens = [];
        const token = (htmlValue) => {
          const key = `\u0000${tokens.length}\u0000`;
          tokens.push(htmlValue);
          return key;
        };

        let res = String(text || "");
        res = res.replace(/`([^`]+)`/g, (match, code) => token(`<code class="obs-inline-code">${escapeHtml(code)}</code>`));
        res = res.replace(/\\\(([\s\S]+?)\\\)/g, (match, tex) => token(renderMath(tex, false)));
        res = res.replace(/(^|[^\\])\$([^$\n]+?)\$/g, (match, prefix, tex) => `${prefix}${token(renderMath(tex, false))}`);
        res = res.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (match, p1, p2) => {
          const displayText = p2 || p1;
          const postName = escapeHtml(p1).replace(/'/g, "\\'");
          return token(`<a href="#" class="obs-internal-link" onclick="openPostByName('${postName}'); return false;">${escapeHtml(displayText)}</a>`);
        });

        res = escapeHtml(res);
        // Obsidian Highlight ==text==
        res = res.replace(/==([^=]+)==/g, '<mark class="obs-highlight">$1</mark>');
        // Bold **text**
        res = res.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        // Italic *text*
        res = res.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        // Strikethrough ~~text~~
        res = res.replace(/~~([^~]+)~~/g, '<del>$1</del>');
        // Standard Link [Text](URL)
        res = res.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" class="obs-ext-link">$1</a>');
        tokens.forEach((htmlValue, index) => {
          res = res.replaceAll(`\u0000${index}\u0000`, htmlValue);
        });
        return res;
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();

        // Check for cardlink codeblock start
        if (trimmed === "```cardlink") {
          closeList();
          inCardLink = true;
          cardData = {};
          continue;
        }

        if (inCardLink) {
          if (trimmed === "```") {
            inCardLink = false;
            const fallbackImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' fill='%23ccc'><rect width='100' height='100'/></svg>";
            html += `
              <a href="${escapeHtml(cardData.url || '#')}" target="_blank" class="obs-cardlink glass-panel">
                <div class="cardlink-content">
                  <div class="cardlink-title">${escapeHtml(cardData.title || '')}</div>
                  <div class="cardlink-desc">${escapeHtml(cardData.description || '')}</div>
                  <div class="cardlink-host">
                    ${cardData.favicon ? `<img src="${escapeHtml(cardData.favicon)}" alt="" class="cardlink-favicon">` : ''}
                    <span>${escapeHtml(cardData.host || '')}</span>
                  </div>
                </div>
                ${cardData.image ? `<div class="cardlink-image"><img src="${escapeHtml(cardData.image)}" onerror="this.src='${fallbackImg}'" alt=""></div>` : ''}
              </a>
            `;
            continue;
          }
          const colonIdx = line.indexOf(':');
          if (colonIdx !== -1) {
            const key = line.slice(0, colonIdx).trim();
            let value = line.slice(colonIdx + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) value = value.slice(1, -1);
            else if (value.startsWith("'") && value.endsWith("'")) value = value.slice(1, -1);
            cardData[key] = value;
          }
          continue;
        }

        const image = trimmed.match(/^!\[\[([^\]|]+)(?:\|[^\]]*)?\]\]$/);
        const heading = trimmed.match(/^(#{1,4})\s+(.+)$/);
        const listItem = trimmed.match(/^[-*]\s+(.+)$/);
        const quote = trimmed.match(/^>\s*(.+)$/);
        const mathDollar = trimmed.match(/^\$\$\s*([\s\S]*?)\s*\$\$$/);
        const mathBracket = trimmed.match(/^\\\[\s*([\s\S]*?)\s*\\\]$/);

        if (!trimmed) {
          closeList();
          continue;
        }

        if (trimmed === "$$" || trimmed.startsWith("$$")) {
          closeList();

          if (mathDollar) {
            html += renderMathBlock(mathDollar[1]);
            continue;
          }

          const mathLines = [];
          const firstLine = trimmed.replace(/^\$\$\s*/, "");
          if (firstLine) mathLines.push(firstLine);

          while (i + 1 < lines.length) {
            i += 1;
            const mathLine = lines[i];
            const endIndex = mathLine.indexOf("$$");

            if (endIndex !== -1) {
              const beforeEnd = mathLine.slice(0, endIndex);
              if (beforeEnd.trim()) mathLines.push(beforeEnd);
              break;
            }

            mathLines.push(mathLine);
          }

          html += renderMathBlock(mathLines.join("\n"));
          continue;
        }

        if (trimmed === "\\[" || trimmed.startsWith("\\[")) {
          closeList();

          if (mathBracket) {
            html += renderMathBlock(mathBracket[1]);
            continue;
          }

          const mathLines = [];
          const firstLine = trimmed.replace(/^\\\[\s*/, "");
          if (firstLine) mathLines.push(firstLine);

          while (i + 1 < lines.length) {
            i += 1;
            const mathLine = lines[i];
            const endIndex = mathLine.indexOf("\\]");

            if (endIndex !== -1) {
              const beforeEnd = mathLine.slice(0, endIndex);
              if (beforeEnd.trim()) mathLines.push(beforeEnd);
              break;
            }

            mathLines.push(mathLine);
          }

          html += renderMathBlock(mathLines.join("\n"));
          continue;
        }

        if (image) {
          closeList();
          let imgSrc = image[1];
          if (!imgSrc.startsWith('http')) {
            imgSrc = getPostAssetPath(post, imgSrc);
          }
          html += `<img class="markdown-image" src="${escapeHtml(imgSrc)}" alt="">`;
          continue;
        }

        if (heading) {
          closeList();
          const level = Math.min(heading[1].length + 1, 4);
          html += `<h${level}>${parseInline(heading[2])}</h${level}>`;
          continue;
        }

        if (listItem) {
          if (!inList) {
            html += "<ul>";
            inList = true;
          }
          html += `<li>${parseInline(listItem[1])}</li>`;
          continue;
        }

        if (quote) {
          closeList();
          html += `<blockquote>${parseInline(quote[1])}</blockquote>`;
          continue;
        }

        closeList();
        html += `<p>${parseInline(trimmed)}</p>`;
      }

      closeList();
      return html;
    }

    async function openPost(post) {
      if (!postArticle || !postList) return;

      const tags = (post.tags || []).map((tag) => `<span class="post-tag">#${escapeHtml(tag)}</span>`).join("");

      postArticle.hidden = false;
      postList.hidden = true;
      if (postHeading) postHeading.parentElement.hidden = true; // 메인 타이틀(전체 글) 숨김
      if (postSearch) postSearch.hidden = true;
      document.querySelector(".post-sort")?.setAttribute("hidden", "");

      postArticle.innerHTML = `
        <div class="post-detail-toolbar">
          <button class="post-back-button" type="button">목록</button>
          ${renderPostNav(post, "post-detail-nav-top")}
        </div>
        <header class="post-article-header">
          <h1 class="post-detail-title">${escapeHtml(post.display)}</h1>
          <span class="post-category-label">${escapeHtml(post.category)}</span>
          <p>${escapeHtml(post.description || "")}</p>
          <div class="post-info-row">
            <div class="post-meta">
              <span>recent ${escapeHtml(post.recent || "-")}</span>
              <span>${Number(post.views || 0)} views</span>
            </div>
            <div class="post-tags">${tags || '<span class="post-tag">#untagged</span>'}</div>
          </div>
        </header>

      } catch (error) {

          <p><a href="${escapeHtml(post.path)}">md 파일 직접 열기</a></p>
        `;
      }

      postArticle.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function closePost() {

      postArticle.hidden = true;
      postList.hidden = false;
      if (postHeading) {
        postHeading.parentElement.hidden = false;
        postHeading.textContent = "전체 글";
      }
      if (postSearch) postSearch.hidden = false;
      document.querySelector(".post-sort")?.removeAttribute("hidden");
    }

    renderTubePostSummary();
    renderCategories();
    renderTags();
    renderPosts();

    const categoryWidget = document.querySelector(".category-widget");
    const categoryToggle = document.querySelector(".category-toggle");

    if (categoryWidget && categoryToggle && categoryList) {
      categoryToggle.addEventListener("click", () => {
        const isCollapsed = categoryWidget.classList.toggle("is-collapsed");
        categoryToggle.setAttribute("aria-expanded", String(!isCollapsed));

    if (postSearch && postSearchInput) {
      postSearch.addEventListener("submit", (e) => e.preventDefault());
      postSearchInput.addEventListener("input", renderPosts);

    postSortButtons.forEach((button) => {
      button.addEventListener("click", () => {

    const homeLink = document.querySelector('a[href="index.html"]');

    if (homeLink) {
      homeLink.addEventListener("click", (e) => {

        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    /* ── Wave Animation v4 — Clean Vector Style ── */
    (function () {
      const canvas = document.getElementById('wave-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width  = rect.width  * dpr;
        canvas.height = rect.height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      const OCEAN_MAIN = '#0085FB'; 
      const SAND       = '#FDBF5A';

      const layers = [
        // Layer 0: Shallow water (touches sand, lightest)
        { color: '#5CBBFF', amp: 14, freq: 0.0022, spd: 0.0010, phase: 0.0, offsetY: 25 },
        // Layer 1: Mid water
        { color: '#2EA0FF', amp: 12, freq: 0.0028, spd: 0.0012, phase: 2.0, offsetY: 10 },
        // Layer 2: Deep water (matches main panel)
        { color: OCEAN_MAIN, amp: 10, freq: 0.0035, spd: 0.0015, phase: 4.0, offsetY: -5 },
      ];

      const bob = { amp: 4, spd: 0.0015 };

      function waveY(x, t, layer, base) {
        return base + layer.offsetY +
               layer.amp * Math.sin(x * layer.freq + t * layer.spd + layer.phase) + 
               (layer.amp * 0.4) * Math.sin(x * layer.freq * 2.3 - t * layer.spd * 1.3);
      }

      function draw() {
        const t = performance.now();
        const w = canvas.getBoundingClientRect().width;
        const h = canvas.getBoundingClientRect().height;

        const bobY = bob.amp * Math.sin(t * bob.spd);
        const baseY = h * 0.45 + bobY;

        ctx.clearRect(0, 0, w, h);

        // 1. Sand Background
        ctx.fillStyle = SAND;
        ctx.fillRect(0, 0, w, h);

        // 2. Layer 0 (Shallow)
        ctx.beginPath();
        ctx.moveTo(0, 0);
        for (let x = 0; x <= w; x += 5) ctx.lineTo(x, waveY(x, t, layers[0], baseY));
        ctx.lineTo(w, 0);
        ctx.closePath();
        ctx.fillStyle = layers[0].color;
        ctx.fill();

        // 3. Foam on Shallow Water
        const shallow = layers[0];
        
        // Translucent foam wash
        ctx.beginPath();
        for (let x = 0; x <= w; x += 5) ctx.lineTo(x, waveY(x, t, shallow, baseY) - 1); 
        for (let x = w; x >= 0; x -= 5) {
          const thickness = 20 + 12 * Math.sin(x * 0.008 - t * 0.002);
          ctx.lineTo(x, waveY(x, t, shallow, baseY) + thickness);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.fill();

        // Solid foam edge
        ctx.beginPath();
        for (let x = 0; x <= w; x += 5) ctx.lineTo(x, waveY(x, t, shallow, baseY) - 2); 
        for (let x = w; x >= 0; x -= 5) {
          const thickness = 6 + 5 * Math.sin(x * 0.012 + t * 0.003);
          ctx.lineTo(x, waveY(x, t, shallow, baseY) + thickness);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.fill();

        // 4. Layer 1 (Mid)
        ctx.beginPath();
        ctx.moveTo(0, 0);
        for (let x = 0; x <= w; x += 5) ctx.lineTo(x, waveY(x, t, layers[1], baseY));
        ctx.lineTo(w, 0);
        ctx.closePath();
        ctx.fillStyle = layers[1].color;
        ctx.fill();
        
        // Mid highlight
        ctx.beginPath();
        for (let x = 0; x <= w; x += 5) {
          const y = waveY(x, t, layers[1], baseY);
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 5. Layer 2 (Deep)
        ctx.beginPath();
        ctx.moveTo(0, 0);
        for (let x = 0; x <= w; x += 5) ctx.lineTo(x, waveY(x, t, layers[2], baseY));
        ctx.lineTo(w, 0);
        ctx.closePath();
        ctx.fillStyle = layers[2].color;
        ctx.fill();

        // Deep highlight
        ctx.beginPath();
        for (let x = 0; x <= w; x += 5) {
          const y = waveY(x, t, layers[2], baseY);
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        requestAnimationFrame(draw);
      }

      requestAnimationFrame(draw);
    })();

  </script>

  <script>
    /* ── Boids Fish Animation ── */
    (function () {
      const canvas = document.getElementById('fish-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      /* --- 설정 --- */
      const NUM_FISH   = 35;
      const VISUAL     = 80;                 // 인식 반경
      const SEP_DIST   = 28;                 // 분리 거리
      const BASE_MAX   = 2.5;
      const BASE_MIN   = 1.2;
      const W_SEP      = 0.05;               // 분리 가중치
      const W_ALI      = 0.04;               // 정렬 가중치
      const W_COH      = 0.001;              // 응집 가중치 (줄임)
      const TURN       = 0.3;                // 가장자리 회피 강도
      const EDGE       = 60;                 // 가장자리 여백

      /* --- 깊이별 남색 (depth 0=깊은곳/멀리, 1=가까이) --- */
      // 깊은 물고기: 작고, 연하고, 느리게
      // 가까운 물고기: 크고, 진하고, 빠르게
      function fishColor(depth) {
        // 남색 RGB: 26, 26, 94 → depth에 따라 밝기·투명도 조절
        const r = 10 + depth * 16;            // 10 ~ 26
        const g = 10 + depth * 16;            // 10 ~ 26
        const b = 50 + depth * 48;            // 50 ~ 98
        const a = 0.25 + depth * 0.55;        // 0.25 ~ 0.80
        return `rgba(${r|0},${g|0},${b|0},${a.toFixed(2)})`;
      }

      let W, H, oceanBottom;
      const school = [];

      /* --- 리사이즈 (HiDPI 대응) --- */
      function resize() {
        const dpr  = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        W = rect.width;
        H = rect.height;
        canvas.width  = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // 파도 시작 지점 = 바다 하한선
        const wave = document.querySelector('.wave-section');
        if (wave) {
          const stackRect = canvas.parentElement.getBoundingClientRect();
          oceanBottom = wave.getBoundingClientRect().top - stackRect.top;
        } else {
          oceanBottom = H * 0.75;
        }
      }

      /* --- 물고기 생성 --- */
      function spawn() {
        school.length = 0;
        for (let i = 0; i < NUM_FISH; i++) {
          const a = Math.random() * Math.PI * 2;
          const baseDepth = Math.random();
          const depthPhase = Math.random() * Math.PI * 2;
          const depthSpd = 0.005 + Math.random() * 0.01; // 천천히 깊이가 변함
          
          const depth = baseDepth + Math.sin(depthPhase) * 0.35;
          const clampedDepth = Math.max(0, Math.min(1, depth));
          
          const spdMul = 0.6 + clampedDepth * 0.4;
          const szMul  = 0.5 + clampedDepth * 0.5;
          const spd = (BASE_MIN + Math.random() * (BASE_MAX - BASE_MIN)) * spdMul;
          const baseSz = 15 + Math.random() * 15;
          
          school.push({
            x:  EDGE + Math.random() * Math.max(1, W - EDGE * 2),
            y:  EDGE + Math.random() * Math.max(1, oceanBottom - EDGE * 2),
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            baseDepth: baseDepth,
            depthPhase: depthPhase,
            depthSpd: depthSpd,
            depth: clampedDepth,
            baseSz: baseSz,
            sz: baseSz * szMul,
            maxSpd: BASE_MAX * spdMul,
            minSpd: BASE_MIN * spdMul,
            tp: Math.random() * Math.PI * 2,
            color: fishColor(clampedDepth),
          });
        }
        // depth 순으로 초기 정렬
        school.sort((a, b) => a.depth - b.depth);
      }

      /* --- 보이드 규칙 적용 --- */
      function update() {
        for (let i = 0; i < school.length; i++) {
          const f = school[i];
          let sx = 0, sy = 0;   // separation
          let ax = 0, ay = 0;   // alignment
          let cx = 0, cy = 0;   // cohesion
          let n = 0;

          for (let j = 0; j < school.length; j++) {
            if (i === j) continue;
            const o = school[j];
            // 비슷한 depth끼리만 상호작용 (레이어 분리)
            if (Math.abs(o.depth - f.depth) > 0.35) continue;
            const dx = o.x - f.x, dy = o.y - f.y;
            const d = Math.sqrt(dx * dx + dy * dy);

            if (d < VISUAL) {
              if (d < SEP_DIST && d > 0) { sx -= dx / d; sy -= dy / d; }
              ax += o.vx; ay += o.vy;
              cx += o.x;  cy += o.y;
              n++;
            }
          }

          if (n) {
            ax /= n; ay /= n;
            cx = cx / n - f.x; cy = cy / n - f.y;
            f.vx += sx * W_SEP + (ax - f.vx) * W_ALI + cx * W_COH;
            f.vy += sy * W_SEP + (ay - f.vy) * W_ALI + cy * W_COH;
          }

          // 가장자리 회피
          if (f.x < EDGE)              f.vx += TURN;
          if (f.x > W - EDGE)          f.vx -= TURN;
          if (f.y < EDGE)              f.vy += TURN;
          if (f.y > oceanBottom - EDGE) f.vy -= TURN;

          // 속도 제한 (depth별 개별 속도)
          const spd = Math.sqrt(f.vx * f.vx + f.vy * f.vy);
          if (spd > f.maxSpd) {
            f.vx = f.vx / spd * f.maxSpd;
            f.vy = f.vy / spd * f.maxSpd;
          } else if (spd < f.minSpd && spd > 0) {
            f.vx = f.vx / spd * f.minSpd;
            f.vy = f.vy / spd * f.minSpd;
          }

          f.x += f.vx;
          f.y += f.vy;
          f.tp += 0.12 + f.depth * 0.06;   // 가까울수록 꼬리 살짝 빠르게

          // 동적 깊이 애니메이션 (위아래로 움직이는 효과)
          f.depthPhase += f.depthSpd;
          let d = f.baseDepth + Math.sin(f.depthPhase) * 0.35;
          f.depth = Math.max(0, Math.min(1, d));

          // 깊이에 따라 크기, 속도, 색상 실시간 업데이트
          const szMul = 0.5 + f.depth * 0.5;
          f.sz = f.baseSz * szMul;
          const spdMul = 0.6 + f.depth * 0.4;
          f.maxSpd = BASE_MAX * spdMul;
          f.minSpd = BASE_MIN * spdMul;
          f.color = fishColor(f.depth);
        }
      }

      /* --- 물고기 그리기 (원뿔형) --- */
      function drawFish(f) {
        const ang = Math.atan2(f.vy, f.vx);
        const s   = f.sz;

        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(ang);

        ctx.beginPath();
        ctx.moveTo(s * 0.7, 0);          // 머리 (앞쪽)
        ctx.lineTo(-s * 0.3, -s * 0.35); // 꼬리 위 (길이를 대폭 줄이고 폭은 원래대로 복구)
        ctx.lineTo(-s * 0.3,  s * 0.35); // 꼬리 아래
        ctx.closePath();

        ctx.fillStyle = f.color;
        ctx.fill();
        ctx.restore();
      }

      /* --- 메인 루프 --- */
      function loop() {
        ctx.clearRect(0, 0, W, H);
        update();
        // 깊이가 실시간으로 변하므로 매 프레임 정렬 (먼 물고기 먼저 렌더링)
        school.sort((a, b) => a.depth - b.depth);
        for (const f of school) drawFish(f);
        requestAnimationFrame(loop);
      }

      resize();
      spawn();
      window.addEventListener('resize', () => { resize(); spawn(); });
      requestAnimationFrame(loop);
    })();

  </script>
