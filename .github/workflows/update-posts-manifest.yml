name: Update posts manifest

on:
  push:
    branches:
      - main
    paths:
      - "posts/**/*.md"
      - "scripts/generate-posts-manifest.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-posts-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate posts manifest
        run: node scripts/generate-posts-manifest.js

      - name: Commit manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update posts manifest"
          file_pattern: posts-manifest.js
