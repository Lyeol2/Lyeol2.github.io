<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="main-desktop">
    <div class="main-stack div-vertical fill">
      <!-- Navigation -->
      <div class="navigate div-horizontal fill-horizontal">
        <div class="icon-panel right-anchor r-padding-30">
          <p class="brand-text right-anchor center">JJIJIM'S BLOG</p>
        </div>

        <div class="navigate-buttons div-horizontal right-anchor end-stacking fill l-padding-20">
          <p class="home-text center">home</p>
          <p class="post-text center">post</p>
          <p class="none-text center">none</p>
          <p class="none-text center">none</p>
        </div>
      </div>

      <!-- Main panel -->
      <div class="main-panel div-horizontal fill-horizontal">
        <p class="title-text fill center">title-text</p>

        <div class="frame frame-right-half" data-slider>
          <div class="slide-track">
            <section class="slide is-active">
              <p class="slide-kicker">01</p>
              <h2>Today</h2>
              <p>짧게 쓰고 자주 돌아보는 기록.</p>
            </section>
            <section class="slide">
              <p class="slide-kicker">02</p>
              <h2>Build</h2>
              <p>만든 것과 고친 이유를 남기기.</p>
            </section>
            <section class="slide">
              <p class="slide-kicker">03</p>
              <h2>Learn</h2>
              <p>다음 작업을 위한 작은 힌트 모으기.</p>
            </section>
          </div>

          <div class="slide-controls" aria-label="슬라이드 조작">
            <button class="slide-button" type="button" data-slide-prev aria-label="이전 슬라이드">‹</button>
            <div class="slide-dots" aria-label="슬라이드 위치">
              <button class="slide-dot is-active" type="button" data-slide-dot="0" aria-label="1번 슬라이드"></button>
              <button class="slide-dot" type="button" data-slide-dot="1" aria-label="2번 슬라이드"></button>
              <button class="slide-dot" type="button" data-slide-dot="2" aria-label="3번 슬라이드"></button>
            </div>
            <button class="slide-button" type="button" data-slide-next aria-label="다음 슬라이드">›</button>
          </div>
        </div>
      </div>

      <!-- Wave section -->
      <div class="wave-section">
        <canvas id="wave-canvas"></canvas>
      </div>

      <!-- Bottom panel -->
      <div class="bottom-panel div-horizontal fill-horizontal"></div>
    </div>
  </main>

  <script>
    const slider = document.querySelector("[data-slider]");

    if (slider) {
      const track = slider.querySelector(".slide-track");
      const slides = [...slider.querySelectorAll(".slide")];
      const dots = [...slider.querySelectorAll(".slide-dot")];
      const prevButton = slider.querySelector("[data-slide-prev]");
      const nextButton = slider.querySelector("[data-slide-next]");
      let currentSlide = 0;

      function showSlide(index) {
        currentSlide = (index + slides.length) % slides.length;
        track.style.transform = `translateX(-${currentSlide * 100}%)`;

        slides.forEach((slide, slideIndex) => {
          slide.classList.toggle("is-active", slideIndex === currentSlide);
        });

        dots.forEach((dot, dotIndex) => {
          dot.classList.toggle("is-active", dotIndex === currentSlide);
        });
      }

      prevButton.addEventListener("click", () => showSlide(currentSlide - 1));
      nextButton.addEventListener("click", () => showSlide(currentSlide + 1));

      dots.forEach((dot) => {
        dot.addEventListener("click", () => showSlide(Number(dot.dataset.slideDot)));
      });
    }

    /* ── Wave Animation v2 — noise-enhanced ── */
    (function () {
      const canvas = document.getElementById('wave-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      /* ─── 리사이즈 (HiDPI) ─── */
      function resize() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width  = rect.width  * dpr;
        canvas.height = rect.height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      /* ─── 노이즈 유틸리티 ─── */
      function hash(n) {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      }

      // 부드러운 1D value noise
      function noise(x) {
        const i = Math.floor(x);
        const f = x - i;
        const u = f * f * (3 - 2 * f); // smoothstep
        return hash(i) * (1 - u) + hash(i + 1) * u;
      }

      // fBm (Fractal Brownian Motion) — 여러 옥타브의 노이즈 합성
      function fbm(x, octaves) {
        let val = 0, amp = 1, freq = 1, max = 0;
        for (let i = 0; i < octaves; i++) {
          val += amp * (noise(x * freq) - 0.5);
          max += amp;
          amp *= 0.5;
          freq *= 2.0;
        }
        return val / max; // 대략 [-0.5, 0.5] 범위
      }

      /* ─── 색상 ─── */
      const OCEAN_DEEP  = '#0070D8';
      const OCEAN       = '#0085FB';
      const OCEAN_LIGHT = '#3DA5FF';
      const SAND        = '#FDBF5A';
      const SAND_WET    = '#E5A94D';

      /* ─── 파도 레이어 (뒤→앞) ─── */
      const waves = [
        { amp: 16, len: 340, spd: 0.35, phase: 0.0, nAmp: 6, nScale: 0.008, fill: OCEAN_DEEP },
        { amp: 11, len: 240, spd: 0.50, phase: 1.6, nAmp: 5, nScale: 0.012, fill: OCEAN },
        { amp:  8, len: 170, spd: 0.70, phase: 3.2, nAmp: 4, nScale: 0.015, fill: OCEAN_LIGHT },
      ];

      // 상하 움직임 (bobbing)
      const bob = { amp: 5, spd: 0.3 };

      /* ─── 파형 y좌표 — 사인파 + fBm 노이즈 ─── */
      function waveY(x, wv, t, base) {
        const sine = wv.amp * Math.sin((x / wv.len) * Math.PI * 2 + t * wv.spd * Math.PI * 2 + wv.phase);
        const n    = wv.nAmp * fbm(x * wv.nScale + t * wv.spd * 0.5, 4);
        return base + sine + n;
      }

      /* ─── 거품 방울 사전 생성 ─── */
      const bubbles = [];
      for (let i = 0; i < 100; i++) {
        bubbles.push({
          xr:  hash(i * 13 + 7),
          yo:  (hash(i * 17 + 3) - 0.5) * 18,
          r:   1 + hash(i * 23 + 11) * 2.5,
          a:   0.25 + hash(i * 31 + 5) * 0.55,
        });
      }

      /* ─── 메인 드로우 ─── */
      const t0 = performance.now();

      function draw(now) {
        const t = (now - t0) / 1000;
        const w = canvas.getBoundingClientRect().width;
        const h = canvas.getBoundingClientRect().height;

        const bobY  = bob.amp * Math.sin(t * bob.spd * Math.PI * 2);
        const baseY = h * 0.42 + bobY;
        const front = waves[waves.length - 1]; // 앞쪽 파도 기준선

        ctx.clearRect(0, 0, w, h);

        /* 1) 배경 — 모래 */
        ctx.fillStyle = SAND;
        ctx.fillRect(0, 0, w, h);

        /* 2) 젖은 모래 그라디언트 — 거품 아래 */
        ctx.beginPath();
        for (let x = 0; x <= w; x += 2) {
          const y = waveY(x, front, t, baseY) + 14;
          if (x === 0) ctx.moveTo(x, y);
          else         ctx.lineTo(x, y);
        }
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        const wetG = ctx.createLinearGradient(0, baseY + 8, 0, baseY + 42);
        wetG.addColorStop(0, SAND_WET);
        wetG.addColorStop(1, SAND);
        ctx.fillStyle = wetG;
        ctx.fill();

        /* 3) 파도 레이어 (뒤→앞) — 노이즈 포함 */
        for (const wv of waves) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          for (let x = 0; x <= w; x += 2) {
            ctx.lineTo(x, waveY(x, wv, t, baseY));
          }
          ctx.lineTo(w, 0);
          ctx.closePath();
          ctx.fillStyle = wv.fill;
          ctx.fill();
        }

        /* 4) 거품 (foam) — 불규칙 너비의 흰 띠 */
        ctx.beginPath();
        for (let x = 0; x <= w; x += 2) {
          const y = waveY(x, front, t, baseY) - 2;
          if (x === 0) ctx.moveTo(x, y);
          else         ctx.lineTo(x, y);
        }
        for (let x = w; x >= 0; x -= 2) {
          const fw = 8 + 7 * fbm(x * 0.02 + t * 0.3, 3); // 노이즈로 너비 변화
          const y  = waveY(x, front, t, baseY) + fw;
          ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fill();

        /* 5) 거품 방울 — 포말 주변 흩뿌려진 점 */
        for (const b of bubbles) {
          const bx = b.xr * w;
          const foamBase = waveY(bx, front, t, baseY);
          const by = foamBase + b.yo;
          if (by >= foamBase - 4 && by <= foamBase + 16) {
            ctx.beginPath();
            ctx.arc(bx, by, b.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${b.a})`;
            ctx.fill();
          }
        }

        /* 6) 파도 마루 하이라이트 — 밝은 선 */
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1.5;
        for (let x = 0; x <= w; x += 2) {
          const y = waveY(x, front, t, baseY) - 3;
          if (x === 0) ctx.moveTo(x, y);
          else         ctx.lineTo(x, y);
        }
        ctx.stroke();

        requestAnimationFrame(draw);
      }

      requestAnimationFrame(draw);
    })();

  </script>
</body>
</html>
